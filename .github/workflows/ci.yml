# Tests and style checks on every push. The VM serves whatever reaches master
# within a minute, so a red mark here is the warning before (or right after) it goes live.
name: CI

# Every branch on push (a pull request shows the run of its branch's last commit), or by hand.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

env:
  # Windows runners print with cp1252; the scripts print Japanese (the PC's console and the VM's journal take UTF-8).
  PYTHONUTF8: "1"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 with Python 3.12 is what the VM runs; Windows is the PC (launcher.py, start.bat).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: python -m pip install "waitress>=3.0,<4"
      - run: python -m unittest discover -s tests
      - name: The VM's scripts
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/setup.sh deploy/update.sh deploy/cloud-init.sh
          shellcheck --severity=warning deploy/*.sh

  lint:
    name: Style (Ruff, Prettier, Taplo)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false # nothing to install but Ruff
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
