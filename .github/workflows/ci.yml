# Tests and style checks on every push and pull request. The VM serves whatever reaches master
# within a minute, so a red mark here is the warning before (or right after) it goes live.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu 24.04 with Python 3.12 is what the VM runs; Windows is the PC (launcher.py, start.bat).
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "waitress>=3.0,<4"
      - run: python -m unittest discover -s tests
      - name: The VM's scripts
        if: runner.os == 'Linux'
        run: |
          bash -n deploy/setup.sh deploy/update.sh deploy/cloud-init.sh
          shellcheck --severity=warning deploy/*.sh

  lint:
    name: Style (Ruff, Prettier)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uvx ruff@0.16.9 check .
      - run: uvx ruff@0.16.9 format --check .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes prettier@3.9.10 --check .
