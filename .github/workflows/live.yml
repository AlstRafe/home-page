# Is the public site answering? Asks it from outside, like a first-time visitor (deploy/livecheck.py).
# A red run (GitHub e-mails the owner) means the VM, Funnel or the last push broke a page.
name: Live site

on:
  schedule:
    - cron: "17 */6 * * *" # every 6 hours (about 1 minute each, well inside the free minutes)
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      url:
        description: "Address to check instead of the usual one (https://name)"
        required: false
        default: ""
      site:
        description: 'Site whose commit to wait for first, e.g. /infra or /val (with "commit")'
        required: false
        default: "/"
      commit:
        description: "Full commit SHA that site should be serving (another repository's merge)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: live
  cancel-in-progress: true

jobs:
  check:
    name: Public pages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      # After a push it first waits until /version.json says the pushed commit is live (the VM pulls
      # master every minute, then restarts into new code), then checks the pages as they are now.
      # Run by hand with site + commit, it confirms another repository's merge is live the same way.
      - run: python3 -u deploy/livecheck.py ${URL:+"$URL"} ${EXPECT:+--expect "$EXPECT" --site "$SITE"}
        env:
          URL: ${{ inputs.url }}
          SITE: ${{ inputs.site || '/' }}
          EXPECT: ${{ github.event_name == 'push' && github.sha || inputs.commit || '' }}
