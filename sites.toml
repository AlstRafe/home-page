tags = ["매시간 업데이트", "영·중 → 한국어", "매체별 비교"]

[site.en-GB]
subtitle = "The news, translated and compared"
description = "Collects the BBC, CNA, Yonhap and tech outlets such as InfoQ and iThome every hour. Read each original beside its translation, and compare how the outlets covered the same story."
