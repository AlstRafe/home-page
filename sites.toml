# サーバー（launcher.py が起動）。ここと Python サイトの指定を変えると、サーバーが自動で再起動します。
[server]
port = 5000 # テスト公開（Tailscale Funnel と Caddy）はこの番号の 127.0.0.1 へ転送している
listen = "network" # "network": Tailscale・LAN・このPC / "local": このPCだけ
# hosts = ["mypc.local"]   # ほかに受け付けるホスト名（このPCの名前・アドレス・*.ts.net は自動）
# 公開の名前（訪問者として扱う。*.ts.net は自動）。VM が Caddy で直接配信する DuckDNS の名前（setup.sh --direct）
public = ["haruxera.duckdns.org"]
moved_to = "haruxera.duckdns.org" # 公開の名前のうちこれ以外（Funnel）で開かれたページを、ここへ転送する

# ── サイトの足し方 ─────────────────────────────────────────────
# 静的ファイル（index.html のあるフォルダ）なら、次の形の [[site]] を1つ足すだけ:
#
# [[site]]
# mount = "/memo"                  # アドレス（/ と英小文字・数字・ハイフン）
# folder = "../Memo"               # このファイルからの相対パスか絶対パス
# name = "Memo"                    # 表示名
# subtitle = "ひとことで何のサイトか"
# headline = "何ができるかを大きな文字でひとこと" # サイトの区画の見出し（省略すると subtitle）
# description = "初めての人に向けた 1〜2 文の説明"
# facts = [["25", "ミッション"], ["無料", "インストール不要"]] # 大きな文字とその説明（4 つまで。ないと tags）
# dark = true                      # この区画をページの「黒い面」に（どちらのテーマでも白い文字。ページに 1 つまで）
# icon = "book"                    # homepage/icons のファイル名（news terminal globe book game chart photo tool music）
# accent = "green"                 # red orange blue teal green amber purple gray
# tags = ["インストール不要"]    # facts がないときに並べる短い特徴
# open = "Memo を開く"             # ボタンの文言（省略すると「<name> を開く」）
# public = false                   # テスト公開の名前では隠す（このPCとLANからだけ見える）。省略すると公開
# home_link = "own"                # 自前の「サイト一覧へ戻る」リンクがあるとき。省略するとポータルが左下に付ける
# preview = "portal.json"          # カードに並べる中身（そのフォルダの JSON。書き換えると一覧に即反映）:
#                                  # {"title": "見出し", "items": [["文", "/サイト内のパス"], ...]}（最大 5 件）
#                                  # 文は {"ja": "…", "ko": "…", "en-GB": "…", "zh-TW": "…"} でもよい
# search = "/search?q={q}"         # カードの検索欄: 入れた言葉を {q} に入れて、サイト内のこのアドレスへ（#… も可）
# search_hint = "記事を検索"        # 検索欄の薄い文字（省略すると「<name> の中を検索」）
# links = [["使い方", "/help"]]     # カードの「よく使うページ」: [["文", "/サイト内のパス"], ...]
#
# [site.en-GB]                     # ほかの言語での name・subtitle・headline・description・facts・tags・open・search_hint・links（ko / en-GB / zh-TW）
# description = "One or two sentences for a first-time visitor"
# links = ["How to use"]           # links は文だけを同じ順に
#
# Python の Web アプリ（WSGI）は folder の代わりに python と entry を書く（サーバーの起動時に読み込む）:
# python = "../MyApp"              # sys.path に足すフォルダ（requirements.txt があれば launcher が入れる）
# entry = "myapp.hosting:site"     # site(mount=..., host={...}) が {"app": WSGIアプリ, ...} を返す
#
# 並び順はこのファイルの順。フォルダや index.html が見つからないサイトは表示しません。
# ────────────────────────────────────────────────────────────

[[site]]
mount = "/news"
python = "../News Site/work/app"
entry = "newsreader.hosting:site" # 名前と副題は News Site 側が返す
description = "BBC・中央社・聯合ニュース・InfoQ・iThome など 8 媒体の記事を 1 時間ごとに集めて日本語に訳し、原文と並べて出します。同じ話題を何社かが書いていれば、まとめて読み比べられます。"
icon = "news"
accent = "red"
search = "/?q={q}"
search_hint = "記事を検索（日本語も可）"
links = [["今日のまとめ", "/digest"], ["読み比べ一覧", "/stories"]]

